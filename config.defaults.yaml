server:
  host: "0.0.0.0"
  port: 8080
  workers: 1

database:
  path: "data/photobox.db"

auth:
  secret_key: ""
  token_expire_minutes: 480
  default_admin_password: "admin"
  default_mieter_password: "mieter"   # Login "Mieter" (eingeschränkter Veranstalter)

admin:
  local_only: false     # true = Admin-API nur von localhost + allowed_ips erreichbar
  allowed_ips: []       # zusätzliche erlaubte Client-IPs, z.B. ["192.168.16.50"]

i18n:
  default_locale: "de"
  available:
    - "de"
    - "en"

photos:
  storage_path: "data/photos"
  thumbnail_size: [320, 240]
  max_resolution: [3000, 2000]
  jpeg_quality: 85
  filename_template: "{event}_{date}_{time}_{seq}"  # placeholders: {event}, {date}, {time}, {seq}, {random}
  download_filename_template: "{event}_{date}_{time}"

guestbook:                   # Gäste malen/schreiben nach der Aufnahme aufs Foto
  enabled: true
  max_message_len: 120       # Zeichen für das Grußwort unter dem Bild
  font: "Sans"               # Schriftart des Grußworts (siehe Vorlagen-Editor)

filters:                     # Looks, die die Gäste vor der Aufnahme wählen
  enabled: true              # false = keine Auswahl im Booth, immer Original
  # Look schon im Live-Bild zeigen. Das ist zwar schöner, kostet aber pro Einzelbild
  # Rechenzeit im Browser — auf schwacher Hardware wird die Vorschau dadurch zum
  # Daumenkino. Dann hier auf false: die Auswahl bleibt, der Look wird weiterhin
  # ins Foto gerechnet, nur das Live-Bild bleibt unbearbeitet und damit flüssig.
  live_preview: true
  # Reihenfolge/Auswahl der angebotenen Looks. Leer lassen = alle. Verfügbar:
  # none, bw, noir, sepia, vintage, warm, cool, pop
  available: []

exif:                        # Metadaten in Fotos, Collagen und GIFs
  enabled: true              # false = Dateien bleiben unbeschriftet
  include_location: true     # GPS-Standort der Veranstaltung einbetten
                             # (Ort/Koordinaten pro Veranstaltung: Admin -> Veranstaltungen)
  artist: ""                 # Fotograf/Betreiber (EXIF "Artist")
  copyright: ""              # Copyright-Hinweis (EXIF "Copyright")

background_removal:
  enabled: false
  mode: "none"               # none | ai | chromakey
  chromakey_hue: 60          # HSV hue (60=green, 120=blue)
  chromakey_tolerance: 30
  chromakey_saturation_min: 50
  replacement_color: "#000000"
  replacement_image: ""
  feather: 3

gif:
  enabled: true
  buffer_seconds: 5
  fps: 10
  # Boomerang: die Aufnahme läuft vorwärts und wieder rückwärts, endlos. Aus den
  # bereits gepufferten Frames gebaut — kostet nur Dateigröße, keine Rechenzeit.
  boomerang: false
  # Bounding box for the GIF (aspect ratio of the source is preserved — no
  # distortion). Frames are only ever DOWNSCALED to fit (never upscaled), so
  # generation stays cheap during a live event; the viewers scale the GIF up for
  # display via CSS. Keep this modest on low-power boxes.
  width: 640
  height: 640

collages:
  templates_path: "templates/collages"

cameras:
  transform:
    # Ausrichtung der Kamera korrigieren (gilt für Vorschau UND gespeichertes Foto)
    rotation: 0           # 0, 90, 180, 270
    flip_horizontal: false
    flip_vertical: false
    # Spiegel-Effekt: Gäste sehen sich seitenverkehrt wie im Spiegel und posieren
    # dadurch richtig herum — das gespeicherte Foto bleibt seitenrichtig, damit
    # Schrift und Logos im Bild lesbar sind.
    mirror_preview: true
  gphoto2:
    enabled: false
    capture_target: 1
  digicamcontrol:
    enabled: false
    host: "localhost"
    port: 5513
  webrtc:
    enabled: true
  opencv:
    enabled: false
    device_index: 0

triggers:
  touchscreen:
    enabled: true
  gpio:
    enabled: false
    pin: 17
    pull_up: true
    debounce_ms: 300
  acoustic:
    enabled: false
    threshold: 0.7
    cooldown_ms: 2000
    device_index: null        # null = System-Standard, oder Index des Audiogeräts
  keyboard:
    enabled: false
    key: "space"
  host_keyboard:
    enabled: false
    key_code: ""              # leer = jede Taste löst aus, oder z.B. "KEY_ENTER"
    device_name: ""           # leer = alle Keyboards, oder Teilname des Geräts
  serial:
    enabled: false
    port: "/dev/ttyUSB0"
    baud: 9600
    trigger_string: "\n"
  bluetooth:
    enabled: false
    device_name: ""

outputs:
  download:
    enabled: true
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    smtp_user: ""
    smtp_pass: ""
    from_address: ""
  printer:
    enabled: false
    mode: "browser"          # browser = Client-Druckdialog, server = serverseitig
    printer_name: ""         # leer = Systemstandard (nur bei mode=server)
    paper_size: "4x6"        # 4x6, A6, 10x15, A4
    copies: 1
    orientation: "portrait"  # portrait | landscape
    fit_to_page: true
    margin_mm: 0             # 0 = randlos
    warn_remaining: 10       # Warnung anzeigen, sobald nur noch so viele Drucke übrig sind
    block_remaining: 1       # Druck STOPPEN, sobald nur noch so viele übrig sind (Puffer vor Null;
                             # 0 = erst bei komplett leer blockieren). Nur bei Druckern, die die
                             # Restmenge melden (Dye-Sub via CUPS-Marker).
  web_upload:
    enabled: false
    base_url: ""
  bluetooth:
    enabled: false
    device: ""               # feste Ziel-MAC (optional; leer = Gast wählt selbst)
    receive_dir: ""          # leer = data/bluetooth_in
  usb_copy:
    enabled: false
    mount_path: "/media/usb"

cd_burn:
  device: "/dev/sr0"          # internes SATA-Laufwerk (CD/DVD wird automatisch erkannt)
  volume_label: "PHOTOBOX"    # Datenträgerbezeichnung
  speed: ""                   # leer = automatisch, sonst z.B. "8" (8x)
  include_gifs: true          # animierte GIFs mit auf die Disc brennen
  eject_when_done: true       # Disc nach dem Brennen auswerfen

usb_export:
  subfolder: "Photobox"       # Zielordner auf dem Datenträger (leer = Wurzel)
  include_gifs: true          # animierte GIFs mitkopieren

payment:
  enabled: false
  required_before_capture: false
  default_amount_cents: 200
  currency: "EUR"
  prices:
    capture: 200            # Preis fürs Foto machen (Cent)
    print: 100              # Preis fürs Drucken (Cent)
    gif: 100                # Preis fürs GIF erstellen (Cent)
    collage: 150            # Preis für Collage (Cent)
  stripe_qr:
    enabled: false
    api_key: ""
  sumup_qr:
    enabled: false
    api_key: ""
    merchant_code: ""
    currency: "EUR"
  sumup_terminal:
    enabled: false
    api_key: ""
    merchant_code: ""
    terminal_id: ""
    currency: "EUR"
  mdb:
    enabled: false
    serial_port: "/dev/ttyUSB1"
    baud: 9600

theme:                    # Oberfläche/Design (über Admin → Design einstellbar)
  primary: "#6c8cff"
  secondary: "#ff8a5b"
  accent: "#2dd4bf"
  background: "#0f1426"
  surface: "#1a2138"
  text: "#f1f4ff"
  text_muted: "#97a3c4"
  radius: 14              # Eckenrundung (px)
  ui_scale: 1.0           # globale UI-Größe
  heading_scale: 1.0      # Überschriften-Größe
  heading_font: ""        # CSS-Schriftart für Überschriften
  background_image: ""    # globales Hintergrundbild (URL)
  background_dim: 0.0     # Abdunklung 0..1 über dem Hintergrundbild

display:
  preview_size: "medium"  # small (320px), medium (640px), large (960px), fullscreen
  idle_live_preview: true # true = Live-Bild auf der Willkommensseite, false =
                          # normale Willkommensseite (Kamera ruht bis "Start")
  # Sicherer Rand in Pixeln, rundum. Viele Kiosk-Bildschirme zeigen nicht das
  # ganze Bild: analoge VGA-Panels sitzen oft ein Stück daneben, Fernseher
  # schneiden per Overscan ab, Einbaurahmen verdecken den Rest. X meldet
  # trotzdem die volle Auflösung — es ist also nichts messbar, nur sichtbar.
  # Wenn am Rand etwas fehlt (Speicheranzeige, Hilfe-Knopf): hier hochdrehen,
  # bis alles drin ist. 20 bis 40 reichen meist.
  safe_margin: 0
  # Speicheranzeige im Booth: low = nur wenn es eng wird (Vorgabe), always =
  # immer, never = nie. Gäste interessiert die freie Plattenkapazität nicht.
  storage_badge: "low"

session:
  auto_end_seconds: 120
  photos_per_session: 0
  countdown_seconds: 3       # Dauer des Countdowns in Sekunden
  sound_enabled: true        # Countdown-Piep + Auslöse-Klick (im Browser erzeugt,
                             # keine Audiodateien nötig)
  sound_volume: 0.6          # 0.0 bis 1.0
  flash_enabled: true        # kurze Weißblende im Moment der Aufnahme
  capture_lead_ms: 0         # ms vor der Null, an denen ausgelöst wird (gleicht
                             # die Auslöseverzögerung der Kamera aus, damit das
                             # Foto genau bei Null entsteht)

gallery:
  public: false
  require_event_slug: true
  enabled: true                # false = Galerie-Link wird ausgeblendet
  # Die Kachel „Galerie (Live)" im Teilen-Bildschirm. Ihr QR-Code nützt nur,
  # wenn das Gästehandy die Adresse erreicht. Ohne Gäste-WLAN und ohne Upload
  # zeigt er auf die LAN-IP der Box — dort kommt niemand an.
  #   auto   = nur zeigen, wenn ein Weg nach draußen existiert: Remote-Galerie
  #            aktiv, Cloudflare-Tunnel an oder share.base_url gesetzt
  #   always = immer zeigen (Verhalten wie früher)
  #   never  = nie zeigen
  live_card: "auto"
  delete_mode: "off"           # off | recent | all — recent = nur Fotos der letzten 5 Min
  delete_recent_minutes: 5     # Zeitfenster für "recent"-Modus

share:                        # QR-Code-Links für Gäste-Handys (Foto/GIF/Galerie)
  base_url: ""                # feste öffentliche Basis-URL (überschreibt alles); leer = LAN-IP
  tunnel:
    enabled: false            # Cloudflare Quick-Tunnel: öffentliche QR-Links ohne Account/Login.
                              # Erfordert cloudflared (scripts/cloudflared-setup.sh bzw.
                              # WITH_CLOUDFLARE=1 beim setup). Die zufällige *.trycloudflare.com
                              # URL steht in data/tunnel_url.txt und wird automatisch verwendet.

telegram:                     # Benachrichtigungen an einen Telegram-Chat
  enabled: false
  bot_token: ""               # von @BotFather (t.me/BotFather -> /newbot)
  chat_id: ""                 # Chat/Gruppen-ID, an die gesendet wird
  notify_help: true           # Hilfe-Knopf im Booth sendet eine Nachricht
  notify_media: true          # Warnung, wenn ein Drucker (fast) leer ist

offline:
  sync_interval_seconds: 60
  sync_url: ""

setup:
  completed: false
